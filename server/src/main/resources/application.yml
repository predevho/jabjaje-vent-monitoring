spring:
  application:
    name: vent-monitoring
  datasource:
    # Local defaults for running outside Docker. Docker Compose overrides these.
    url: jdbc:postgresql://localhost:5432/vent
    username: vent
    password: vent
  flyway:
    # Schema only. Demo seed data is added by the demo profile (application-demo.yml, ADR-0011).
    locations: classpath:db/migration
  jpa:
    open-in-view: false
    hibernate:
      # Flyway owns the schema; Hibernate only checks that entities match it.
      ddl-auto: validate
    properties:
      # Read and write timestamps in UTC so API responses do not depend on the server's time zone.
      hibernate.jdbc.time_zone: UTC
      hibernate.timezone.default_storage: NORMALIZE_UTC

vent:
  telemetry:
    # 측정값 품질 판정 기준 (스펙 5.2, #3)
    quality:
      late-threshold: 2m
      clock-skew-tolerance: 5m
      co2-ppm: { min: 1, max: 10000 }
      temp-c: { min: -40, max: 60 }
      humidity-pct: { min: 0, max: 100 }
      airflow-cmh: { min: 0, max: 2000 }
      filter-pa: { min: 0, max: 2000 }
  anomaly:
    # 필터 막힘 기준 (#4). 실제 값은 제조사 매뉴얼로 확인해야 한다.
    filter-clogged:
      default-threshold-pa: 150
      resolve-margin-pa: 20
      model-thresholds-pa:
        "[DOMEKT R 300V]": 150
        "[DOMEKT R 450V]": 150
    # "N분 지속" 규칙 (스펙 6.1, #5). 지속 시간(lasting)은 시연 때 Docker Compose 환경변수로 줄인다.
    continuity:
      max-gap: 2m
    co2-high:
      raise-ppm: 1000
      critical-ppm: 1500
      clear-ppm: 900
      lasting: 10m
    airflow-below-target:
      ratio: 0.8
      lasting: 30m
    bypass-too-long:
      lasting: 60m
  command:
    # 부스트 요청 기준 (스펙 7.1, #8). 실제 최대 풍량은 제조사 매뉴얼로 확인해야 한다.
    boost:
      max-duration: 2h
      model-max-airflow-cmh:
        "[DOMEKT R 300V]": 300
        "[DOMEKT R 450V]": 450
    # 원격 명령 신뢰성 (스펙 7.1·7.2, #9): 10초 응답 없으면 1회 재시도, 그래도 없으면 시간 초과. 발행 뒤 60초면 만료
    reliability:
      response-wait: 10s
      max-retries: 1
      expires-after: 60s
      check-interval: 2s
  hood:
    # 후드 연동 판정 (스펙 6.2, #7). HOOD_ON 직전 급기와 60초 뒤 첫 급기를 비교한다.
    interlock:
      response-wait: 60s
      min-supply-rise-ratio: 0.1
      max-reading-gap: 2m
      give-up-after: 24h
      check-interval: 30s
  gateway:
    # 게이트웨이 연결 상태 기준 (스펙 6.3, #6). 시연에서는 offline-after를 짧게 바꿔 쓴다.
    connection:
      interrupted-after: 2m
      offline-after: 30m
      check-interval: 30s
  assessment:
    # A/S 신청 AI 소견 (스펙 8장, #10). 상황 요약은 최근 7일, 검증 실패 시 1회 재시도
    window: 7d
    telemetry-interval: 30s
    max-attempts: 2
    # AI 호출 한 번의 최대 대기 시간. pending-after는 call-timeout × max-attempts보다 길어야 한다
    call-timeout: 30s
    pending-after: 2m
    pending-check-interval: 60s
    # 판매 중인 교체 부품. AI 입력과 검증에 같이 쓴다
    parts:
      - DOMEKT R 300V 교체 필터 세트
      - DOMEKT R 450V 교체 필터 세트
      - VEMC 신호 케이블
      - 급기 디퓨저
      - 배기 그릴
    # AI 구현: fake(가짜, 기본). 실제 Claude 구현은 #12
    client: fake
    # 가짜 AI 응답 방식: normal, bad-part, bad-evidence, forbidden-phrase, broken-json, flaky, unavailable
    fake:
      mode: normal
  mqtt:
    # Docker Compose overrides this with the broker's service name.
    server-uri: tcp://localhost:1883
    client-id: vent-server
