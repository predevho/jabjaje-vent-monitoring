services:
  mosquitto:
    image: eclipse-mosquitto:2
    ports:
      - "1883:1883"
    volumes:
      - ./infra/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mosquitto-data:/mosquitto/data

  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: vent
      POSTGRES_USER: vent
      POSTGRES_PASSWORD: vent
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vent -d vent"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build:
      context: .
      dockerfile: server/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      mosquitto:
        condition: service_started
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/vent
      SPRING_DATASOURCE_USERNAME: vent
      SPRING_DATASOURCE_PASSWORD: vent
      VENT_MQTT_SERVER_URI: tcp://mosquitto:1883
    ports:
      - "8080:8080"

  # 가상 게이트웨이: 현장 3곳의 측정값을 발행한다 (스펙 3.3)
  simulator:
    build:
      context: .
      dockerfile: simulator/Dockerfile
    depends_on:
      mosquitto:
        condition: service_started
      app:
        condition: service_started
    environment:
      MQTT_URI: tcp://mosquitto:1883
      INTERVAL_SECONDS: "30"

volumes:
  mosquitto-data:
  postgres-data:
