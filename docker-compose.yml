services:
  mosquitto:
    image: eclipse-mosquitto:2
    ports:
      # 내 컴퓨터에서만 연다. 저장소에 공개된 시연 비밀번호로 같은 네트워크의 누군가가 접속하지 못하게 (#13)
      - "127.0.0.1:1883:1883"
    # 시작할 때 환경변수로 비밀번호 파일을 만든 뒤 브로커를 띄운다 (#13). 설정·ACL·스크립트는 읽기 전용으로 넣는다.
    entrypoint: ["/bin/sh", "/mosquitto/config/entrypoint.sh"]
    environment:
      MQTT_PASSWORD_VENT_SERVER: ${MQTT_PASSWORD_VENT_SERVER:-vent-server-demo}
      MQTT_PASSWORD_GW_S1: ${MQTT_PASSWORD_GW_S1:-gw-s1-demo}
      MQTT_PASSWORD_GW_S2: ${MQTT_PASSWORD_GW_S2:-gw-s2-demo}
      MQTT_PASSWORD_GW_S3: ${MQTT_PASSWORD_GW_S3:-gw-s3-demo}
    volumes:
      - ./infra/mosquitto:/mosquitto/config:ro
      - mosquitto-data:/mosquitto/data

  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: vent
      POSTGRES_USER: vent
      POSTGRES_PASSWORD: vent
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vent -d vent"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build:
      context: .
      dockerfile: server/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      mosquitto:
        condition: service_started
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/vent
      SPRING_DATASOURCE_USERNAME: vent
      SPRING_DATASOURCE_PASSWORD: vent
      VENT_MQTT_SERVER_URI: tcp://mosquitto:1883
      # 서버 브로커 계정 (#13). 브로커가 계정 이름을 클라이언트 ID로 쓰므로 둘을 같게 둔다.
      VENT_MQTT_CLIENT_ID: vent-server
      VENT_MQTT_USERNAME: vent-server
      VENT_MQTT_PASSWORD: ${MQTT_PASSWORD_VENT_SERVER:-vent-server-demo}
      # 시연용 현장 3곳 시드 데이터를 넣는다 (ADR-0011)
      SPRING_PROFILES_ACTIVE: demo
      # 게이트웨이 연결 기준 (#6). 시연 때는 짧게: VENT_GATEWAY_OFFLINE_AFTER=3m docker compose up -d
      VENT_GATEWAY_CONNECTION_INTERRUPTED_AFTER: ${VENT_GATEWAY_INTERRUPTED_AFTER:-2m}
      VENT_GATEWAY_CONNECTION_OFFLINE_AFTER: ${VENT_GATEWAY_OFFLINE_AFTER:-30m}
      # "N분 지속" 이상 규칙 (#5). 시연 때는 짧게: VENT_CO2_LASTING=2m VENT_AIRFLOW_LASTING=2m VENT_BYPASS_LASTING=2m
      VENT_ANOMALY_CO2HIGH_LASTING: ${VENT_CO2_LASTING:-10m}
      VENT_ANOMALY_AIRFLOWBELOWTARGET_LASTING: ${VENT_AIRFLOW_LASTING:-30m}
      VENT_ANOMALY_BYPASSTOOLONG_LASTING: ${VENT_BYPASS_LASTING:-60m}
    ports:
      - "8080:8080"

  # 가상 게이트웨이: 현장 3곳의 측정값을 발행한다 (스펙 3.3)
  simulator:
    build:
      context: .
      dockerfile: simulator/Dockerfile
    depends_on:
      mosquitto:
        condition: service_started
      app:
        condition: service_started
    environment:
      MQTT_URI: tcp://mosquitto:1883
      # 게이트웨이별 브로커 계정 비밀번호 (#13). 계정 이름은 게이트웨이 ID
      MQTT_PASSWORD_GW_S1: ${MQTT_PASSWORD_GW_S1:-gw-s1-demo}
      MQTT_PASSWORD_GW_S2: ${MQTT_PASSWORD_GW_S2:-gw-s2-demo}
      MQTT_PASSWORD_GW_S3: ${MQTT_PASSWORD_GW_S3:-gw-s3-demo}
      INTERVAL_SECONDS: "30"
      CONTROL_PORT: "8090"
    ports:
      # 시나리오 제어 API (예: curl -X POST localhost:8090/sites/2/filter-clog)
      - "127.0.0.1:8090:8090"

volumes:
  mosquitto-data:
  postgres-data:
