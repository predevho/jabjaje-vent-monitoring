# MQTT 브로커 설정 (ADR-0007, #13).
# @author predevho (AI 보조: Claude)
# @since 2026-10-23 (#1)

listener 1883

# 익명 접속은 거부한다. 게이트웨이와 서버는 계정으로 접속한다 (스펙 9.2 S1).
allow_anonymous false
# 비밀번호 파일은 저장소에 두지 않고, 컨테이너가 시작할 때 환경변수로 만든다 (entrypoint.sh).
password_file /mosquitto/run/passwd
# 계정마다 쓸 수 있는 토픽 (최소 권한). 저장소의 acl을 시작할 때 권한을 좁혀 복사한 것이다 (entrypoint.sh).
acl_file /mosquitto/run/acl

# 클라이언트 ID를 계정 이름으로 고정한다. 그러지 않으면 계정만 있으면 다른 클라이언트 ID로 접속해
# 서버나 다른 게이트웨이의 연결을 끊을 수 있다(같은 클라이언트 ID가 접속하면 먼저 붙은 쪽이 끊긴다).
use_username_as_clientid true

# 재시작해도 retained 메시지와 persistent session을 유지한다.
persistence true
persistence_location /mosquitto/data/
